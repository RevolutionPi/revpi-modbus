include:
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "base.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/package-devel.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/reuse-lint.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "/check-commit/lint-commit.yml"
  - project: "revolutionpi/infrastructure/ci-templates"
    file: "create-pristine-tar.yml"
  - local: debian/gitlab-ci.yml
    rules:
      - exists:
          - debian/gitlab-ci.yml

variables:
  SRCPKG_NAME: revpi-modbus

static-analysis:
  stage: lint
  image: snowstep/llvm:trixie
  tags:
    - self-hosted
    - docker
    - host-amd64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  # install missing dependencies of container
  # create needed version.h file
  # run tidy with obsolete POSIX version functions
  script:
    - apt update && apt install -y libtss2-dev cmake scdoc systemd-dev libmodbus-dev
    - cmake
        -Bbuild -DCMAKE_C_CLANG_TIDY:STRING="clang-tidy"
        -DCMAKE_C_STANDARD="99"
        .
    - cmake --build build

